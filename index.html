<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today, for you</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:ital,opsz,wght@1,144,500&display=swap">
<style>
:root{
  --bg1:#BFE8F2; --bg2:#E4F5EC; --ink:#10394A; --card:rgba(255,255,255,.7); --heart:#F0546F; --blob:rgba(255,255,255,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg1:#0E2A3A; --bg2:#1D4B55; --ink:#F1FAF7; --card:rgba(255,255,255,.1); --heart:#FF7A93; --blob:rgba(255,255,255,.08)}
}
:root[data-theme="dark"]{--bg1:#0E2A3A; --bg2:#1D4B55; --ink:#F1FAF7; --card:rgba(255,255,255,.1); --heart:#FF7A93; --blob:rgba(255,255,255,.08)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{min-height:100vh;background:linear-gradient(170deg,var(--bg1),var(--bg2));color:var(--ink);font-family:Georgia,serif;display:flex;align-items:center;justify-content:center;position:relative;overflow-x:hidden}
.blob{position:absolute;border-radius:50%;background:var(--blob);filter:blur(2px)}
.b1{width:260px;height:260px;top:-70px;right:-60px}
.b2{width:200px;height:200px;bottom:6%;left:-70px}
main{position:relative;z-index:1;width:min(90vw,380px);text-align:center;padding:36px 22px;box-sizing:border-box;background:var(--card);border-radius:28px;backdrop-filter:blur(6px);box-shadow:0 20px 50px rgba(16,57,74,.15);margin:24px 0}
.gm{font-size:1rem;letter-spacing:.18em;text-transform:uppercase;margin:0 0 .6em;opacity:.8}
h1{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(3rem,15vw,4.4rem);line-height:1;margin:0}
.date{margin:.5em 0 1.6em;opacity:.8;font-size:1.05rem}
.msg{font-family:Caveat,"Segoe Script","Bradley Hand",cursive;font-weight:600;font-size:clamp(1.7rem,7vw,2.2rem);line-height:1.2;margin:0 auto 1.4em;max-width:16ch}
.love{font-family:Caveat,"Segoe Script","Bradley Hand",cursive;font-weight:600;font-size:2rem;margin:0;display:flex;justify-content:center;align-items:center;gap:.25em}
.love svg{width:.8em;height:.8em;fill:var(--heart);animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
main{animation:in .9s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){main,.love svg{animation:none}}
</style>
</head>
<body>
<div class="blob b1" aria-hidden="true"></div>
<div class="blob b2" aria-hidden="true"></div>
<main>
  <p class="gm">Good morning</p>
  <h1 id="day">Today</h1>
  <p class="date" id="date"></p>
  <p class="msg" id="msg"></p>
  <p class="love">I love you <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21C5 15.800 3 12.300 3 9 3 6.400 5 4.600 7.400 4.600c1.900 0 3.400 1 4.600 2.900 1.200-1.900 2.700-2.900 4.600-2.900C19 4.600 21 6.400 21 9c0 3.300-2 6.800-9 12z"/></svg></p>
</main>
<script>
var msgs=[
"Have a beautiful day.",
"Go shine today.",
"Think of me when you smile.",
"You\u2019ve got this.",
"Drink water, eat well, be happy.",
"I\u2019m proud of you.",
"You make my world softer.",
"Sending you a big hug.",
"Today is yours.",
"Can\u2019t wait to see you.",
"You\u2019re on my mind, always.",
"Make today a good one.",
"Be kind to yourself today.",
"You\u2019re my favorite person."
];
var d=new Date();
var days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var dayN=Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);
document.getElementById('day').textContent=days[d.getDay()];
document.getElementById('date').textContent=d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
document.getElementById('msg').textContent=msgs[dayN%msgs.length];
</script>
</body>
</html>
