<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Good morning</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fraunces:ital,opsz,wght@1,144,500&display=swap">
<style>
:root{
  --sky-top:#FFD6A5; --sky-mid:#FFB3A7; --sky-low:#C8B6E8; --ink:#3A2457; --sun:#FFD25E; --hill1:#7A5FA8; --hill2:#4B3578; --heart:#E0436B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--sky-top:#F7B98A; --sky-mid:#D98AA0; --sky-low:#6E5A9E; --ink:#2A1747; --sun:#FFD25E; --hill1:#3F2D6B; --hill2:#241548; --heart:#E0436B}
}
:root[data-theme="dark"]{--sky-top:#F7B98A; --sky-mid:#D98AA0; --sky-low:#6E5A9E; --ink:#2A1747; --sun:#FFD25E; --hill1:#3F2D6B; --hill2:#241548; --heart:#E0436B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 50%,var(--sky-low) 100%);color:var(--ink);overflow:hidden;position:relative;font-family:Georgia,serif}
.sun{position:absolute;left:50%;bottom:22%;width:min(70vw,300px);aspect-ratio:1;margin-left:calc(min(70vw,300px)/-2);border-radius:50%;background:radial-gradient(circle,var(--sun) 0 55%,rgba(255,210,94,.35) 56% 70%,rgba(255,210,94,0) 71%);animation:rise 3s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(70%);opacity:.2}to{transform:translateY(0);opacity:1}}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:34%}
.msg{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8vh 24px 0;text-align:center;box-sizing:border-box}
h1{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(2.8rem,13vw,5rem);line-height:1;margin:0 0 .4em}
.nice{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:clamp(1.3rem,5vw,1.8rem);margin:0 0 1.2em}
.love{font-family:Caveat,"Segoe Script","Bradley Hand",cursive;font-weight:600;font-size:clamp(2.2rem,9vw,3.2rem);margin:0;display:flex;align-items:center;gap:.25em}
.love svg{width:.8em;height:.8em;fill:var(--heart);animation:beat 1.6s ease-in-out 3s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.note{max-width:30ch;font-size:clamp(1rem,4vw,1.15rem);line-height:1.5;margin:1.4em 0 1em}
.more{font-family:Georgia,serif;font-size:1rem;color:var(--ink);background:rgba(255,255,255,.55);border:1.5px solid var(--ink);border-radius:999px;padding:.65em 1.4em;cursor:pointer}
.more:focus-visible{outline:3px solid var(--heart);outline-offset:3px}
.extra{font-family:Caveat,"Segoe Script","Bradley Hand",cursive;font-weight:600;font-size:clamp(1.5rem,6vw,2rem);min-height:3.2em;max-width:20ch;margin:1em 0 0;line-height:1.2}
@media (prefers-reduced-motion: reduce){.sun,.love svg{animation:none}}
</style>
</head>
<body>
<div class="sun" aria-hidden="true"></div>
<svg class="hills" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 60 Q90 20 200 55 T400 40 V120 H0Z" fill="var(--hill1)"/>
  <path d="M0 85 Q110 55 220 82 T400 72 V120 H0Z" fill="var(--hill2)"/>
</svg>
<main class="msg">
  <h1>Good morning</h1>
  <p class="nice">Have a nice day.</p>
  <p class="love">I love you <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21C5 15.800 3 12.300 3 9 3 6.400 5 4.600 7.400 4.600c1.900 0 3.400 1 4.600 2.900 1.200-1.900 2.700-2.900 4.600-2.900C19 4.600 21 6.400 21 9c0 3.300-2 6.800-9 12z"/></svg></p>
  <p class="note">Wake up slowly, drink some water, and remember someone is thinking about you today.</p>
  <button class="more" id="more">Tap for a little something</button>
  <p class="extra" id="extra" aria-live="polite"></p>
</main>
<script>
var msgs=["You’re my favorite part of every day.","Go be amazing, I’m cheering for you.","Your smile is my good morning.","Today is better because you’re in it.","Eat something good and take care of yourself for me.","I can’t wait to see you again.","Whatever today brings, you’ve got this."];
var i=-1,b=document.getElementById('more'),e=document.getElementById('extra');
b.addEventListener('click',function(){i=(i+1)%msgs.length;e.textContent=msgs[i];b.textContent='One more';});
</script>
</body>
</html>
