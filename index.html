<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Just because</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght@1,144,500&display=swap">
<style>
:root{
  --bg:#E9E1F2; --ink:#2B1B3D; --cover:#2B1B3D; --cover-ink:#F6D9E0; --paper:#FBF7FC; --accent:#D6446B; --hint:#6B5A80;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140C1E; --ink:#2B1B3D; --cover:#F6D9E0; --cover-ink:#2B1B3D; --paper:#FBF7FC; --accent:#D6446B; --hint:#B9A8CF;
  }
}
:root[data-theme="dark"]{
  --bg:#140C1E; --ink:#2B1B3D; --cover:#F6D9E0; --cover-ink:#2B1B3D; --paper:#FBF7FC; --accent:#D6446B; --hint:#B9A8CF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;font-family:Georgia,serif}
.scene{perspective:1400px;width:min(86vw,340px);aspect-ratio:3/4.2}
.card{position:relative;width:100%;height:100%;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1);-webkit-tap-highlight-color:transparent}
.card.open{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 40px rgba(20,8,32,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box}
.front{background:var(--cover);color:var(--cover-ink)}
.front h1{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:500;font-size:2.6rem;line-height:1.05;margin:18px 0 0;text-align:center}
.front svg{width:64px;height:64px}
.back{background:var(--paper);color:var(--ink);transform:rotateY(180deg);padding:30px 28px;text-align:left;align-items:flex-start}
.back p{font-family:Caveat,"Segoe Script","Bradley Hand",cursive;font-weight:500;font-size:1.5rem;line-height:1.32;margin:0 0 .9em}
.back p:last-child{margin:0;color:var(--accent);font-weight:600;font-size:1.7rem}
.hint{color:var(--hint);font-size:.9rem;font-family:Georgia,serif;font-style:italic;margin:0}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:6px;border-radius:8px}
@media (prefers-reduced-motion: reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="scene">
  <button class="card" id="card" aria-label="Open the card" aria-pressed="false">
    <div class="face front">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5C5 15.5 3 12 3 8.8 3 6.2 5 4.5 7.3 4.5c1.9 0 3.4 1 4.7 2.9 1.3-1.9 2.8-2.9 4.7-2.9C19 4.5 21 6.2 21 8.8c0 3.200-2 6.700-9 11.700z"/></svg>
      <h1>Just<br>because.</h1>
    </div>
    <div class="face back">
      <p>I don’t say it enough,<br>so I’m saying it now:<br>you make my ordinary days<br>feel like something worth having.</p>
      <p>No grand gesture, no big plan,<br>just this, plain and true:</p>
      <p>I’m really glad it’s you.</p>
    </div>
  </button>
</div>
<p class="hint" id="hint">Tap to open</p>
<script>
var c=document.getElementById('card'),h=document.getElementById('hint');
c.addEventListener('click',function(){
  var o=c.classList.toggle('open');
  c.setAttribute('aria-pressed',o);
  c.setAttribute('aria-label',o?'Close the card':'Open the card');
  h.textContent=o?'Tap to close':'Tap to open';
});
</script>
</body>
</html>
